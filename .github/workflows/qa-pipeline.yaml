name: qa_pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      -
      - name: Instalacion
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas con tag
        run: mvn clean test -Dkarate.tags=@automation-api