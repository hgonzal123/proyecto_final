name: qa_pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: CLonaciond el repositorio
        uses: actions/checkout@v4

      - name: Instalacion
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas con tag
        run: mvn clean test -Dkarate.tags=@automation-api

      - name: Visualizar reporte
        run: |
          cd target
          if [ -d "karate-reports" ]; then
            echo "Reporte generado en target/karate-reports/karate-summary.html"
          else
            echo "No se generó el reporte de Karate"
          fi